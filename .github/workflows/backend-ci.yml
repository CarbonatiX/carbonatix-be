name: Backend CI Branch

on:
  push:
    branches: [main, dev/indah]
  pull_request:
    branches: [main, dev/indah]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Black
        run: black --check .

      - name: Run Ruff
        run: ruff check .

      - name: Run Tests
        run: pytest -vv

  docker:
    name: Build & Run Backend
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # server/.env is gitignored, but compose reads it via env_file. The
      # example defaults are enough for a smoke test: Compose overrides
      # MONGODB_URI to the database service, and Elice/Helpy stay empty.
      - name: Prepare env
        run: cp server/.env.example server/.env

      - name: Build backend image
        run: docker compose build server

      - name: Start database and backend
        run: docker compose up -d database server

      - name: Check containers
        run: docker compose ps

      - name: Wait for backend
        run: sleep 10

      - name: Check backend API
        run: curl --fail http://localhost:8000/docs

      - name: Show logs if failed
        if: failure()
        run: docker compose logs database server
        
      - name: Stop containers
        if: always()
        run: docker compose down -v