name: Backend CI Branch

on:
  push:
    branches: [main, dev/indah]
  pull_request:
    branches: [main, dev/indah]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Black
        run: black --check .

      - name: Run Ruff
        run: ruff check .

      - name: Run Tests
        env:
          PYTHONPATH: .:server
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: pytest -vv
