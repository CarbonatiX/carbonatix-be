services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbonatix-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./carbonatix-be/.env
    volumes:
      - uploads:/app/uploads
    networks:
      - carbonatix-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: carbonatix-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - carbonatix-network

volumes:
  uploads:

networks:
  carbonatix-network:
    driver: bridge