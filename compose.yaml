services:
  database:
    image: mongo:latest
    container_name: carbonatix-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - carbonatix-network

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbonatix-api
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:8000"
    env_file:
      - ./server/.env
    environment:
      # `server/.env` is loaded via env_file above, but its MONGODB_URI is
      # usually `localhost` — which inside this container means the container
      # itself, not your host. So the container needs its own value.
      #
      # Default: the bundled `database` service, so a fresh clone (and CI) is
      # self-contained with no extra setup.
      # Override: set MONGODB_URI in your shell, or in a repo-root `.env`,
      # which Compose reads for interpolation. That is how you point the
      # container at Atlas or any other remote without editing this file.
      MONGODB_URI: ${MONGODB_URI:-mongodb://database:27017}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - carbonatix-network

volumes:
  mongo_data:
  uploads:

networks:
  carbonatix-network:
    driver: bridge
