services:
  database:
    image: mongo:latest
    container_name: carbonatix-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - carbonatix-network

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbonatix-api
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:8000"
    env_file:
      - ./server/.env
    environment:
      # Overrides MONGODB_URI from server/.env so the same file works for both
      # the native venv (localhost) and this container (Compose network DNS).
      # Comment out to make the container use the URI in server/.env instead.
      MONGODB_URI: mongodb://database:27017
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - carbonatix-network

volumes:
  mongo_data:
  uploads:

networks:
  carbonatix-network:
    driver: bridge
