services:
  database:
    image: mongo:latest
    container_name: carbonatix-db
    env_file:
      - ./server/.env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - carbonatix-network

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbonatix-api
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:8000"
    env_file:
      - ./server/.env
    depends_on:
      - database
    volumes:
      - uploads:/app/uploads
    networks:
      - carbonatix-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: carbonatix-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:8501"
    environment:
      BASE_URL: http://server:8000
    depends_on:
      - server
    networks:
      - carbonatix-network

volumes:
  mongo_data:
  uploads:

networks:
  carbonatix-network:
    driver: bridge
